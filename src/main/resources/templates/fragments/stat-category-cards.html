<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Card grid for a stat category: one card per stat with its top-10 leaders.
      Model: categoryPage (StatCategoryPageService.CategoryPage) + fmt. */-->
<th:block th:fragment="cards">

    <!-- th:if on a th:block wrapper — th:replace on the same element would run first (precedence gotcha) -->
    <th:block th:if="${!categoryPage.hasData()}">
        <div th:replace="~{fragments/empty-state :: emptyState('No snapshot data for this season yet — stats appear after the first calculation run.', null, null)}"></div>
    </th:block>

    <div class="cat-grid" th:if="${categoryPage.hasData()}">
        <div class="card cat-card" th:each="card : ${categoryPage.cards()}">
            <div class="cat-card__head">
                <h3 class="cat-card__title">
                    <a th:href="@{'/seasons/' + ${categoryPage.year()} + '/stats/' + ${card.info().name()}}"
                       th:text="${card.info().title()}">Win Percentage</a>
                </h3>
                <span class="cat-card__dir"
                      th:text="${card.info().higherIsBetter()} ? 'Higher is better' : 'Lower is better'">Higher is better</span>
            </div>
            <p class="cat-card__desc" th:if="${card.info().description() != null}"
               th:text="${card.info().description()}">Description.</p>

            <table class="cat-card__table" th:if="${!card.leaders().isEmpty()}">
                <tbody>
                <tr th:each="row : ${card.leaders()}">
                    <td class="cat-card__rank" th:text="${row.rank()}">1</td>
                    <td class="cat-card__team">
                        <img class="cat-card__logo" th:if="${row.logoUrl() != null}" th:src="${row.logoUrl()}"
                             alt="" width="18" height="18" loading="lazy"/>
                        <a th:href="@{'/teams/' + ${row.teamId()}}" th:text="${row.teamName()}">Team</a>
                    </td>
                    <td class="cat-card__value" th:text="${fmt.value(row.value(), card.info().format())}">92.5%</td>
                </tr>
                </tbody>
            </table>
            <p class="cat-card__empty text-muted" th:if="${card.leaders().isEmpty()}">No data for this date.</p>

            <div class="cat-card__links">
                <a th:href="@{'/seasons/' + ${categoryPage.year()} + '/stats/' + ${card.info().name()}}">Full rankings &rarr;</a>
                <a th:href="@{'/seasons/' + ${categoryPage.year()} + '/stats/predictor/' + ${card.info().name()}}">Predictiveness &rarr;</a>
            </div>
        </div>
    </div>

</th:block>

</body>
</html>
