<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Preseason lead: never-too-early top 10 (left) + live countdown to opening tip (right).
     m: title, subtitle, rows (RankRow), tipInstantMs (nullable epoch ms), tipLabel -->
<section th:fragment="panel(m)" class="home-panel">
    <div class="home-split">

        <div class="home-split__col" th:if="${!#lists.isEmpty(m.rows)}">
            <div class="home-panel__header">
                <h2 class="home-panel__title">
                    <span th:text="${m.title}">Never-Too-Early Top 10</span>
                    <span class="home-panel__date" th:text="${m.subtitle}">Where last season left off</span>
                </h2>
                <a class="home-panel__more" th:href="@{/rankings}">Full rankings →</a>
            </div>
            <div class="home-rows">
                <a th:each="r : ${m.rows}" class="home-row" th:href="@{'/teams/' + ${r.teamId}}">
                    <span class="home-rank__num" th:text="${r.rank}">1</span>
                    <span class="home-row__team">
                        <img th:if="${r.logoUrl}" th:src="${r.logoUrl}"
                             class="home-row__logo" loading="lazy" width="20" height="20" alt=""/>
                        <span class="home-row__name" th:text="${r.name}">Duke</span>
                    </span>
                    <span class="home-rank__rating" th:if="${r.rating != null}"
                          th:text="${#numbers.formatDecimal(r.rating, 1, 1)}">24.3</span>
                </a>
            </div>
        </div>

        <div class="home-split__col">
            <div class="home-countdown card" th:if="${m.tipInstantMs != null}"
                 th:attr="data-tip=${m.tipInstantMs}">
                <div class="home-countdown__label">Season tips off in</div>
                <div class="home-countdown__clock">
                    <div class="home-countdown__unit">
                        <span class="home-countdown__num">—</span>
                        <span class="home-countdown__unit-label">Days</span>
                    </div>
                    <div class="home-countdown__unit">
                        <span class="home-countdown__num">—</span>
                        <span class="home-countdown__unit-label">Hours</span>
                    </div>
                    <div class="home-countdown__unit">
                        <span class="home-countdown__num">—</span>
                        <span class="home-countdown__unit-label">Minutes</span>
                    </div>
                    <div class="home-countdown__unit">
                        <span class="home-countdown__num">—</span>
                        <span class="home-countdown__unit-label">Seconds</span>
                    </div>
                </div>
                <div class="home-countdown__when" th:text="${m.tipLabel}">Monday, November 3 · 7:00 PM ET</div>
            </div>
            <div class="home-countdown home-countdown--empty card" th:if="${m.tipInstantMs == null}">
                The season returns in November — schedule coming soon.
            </div>
        </div>

    </div>

    <script>
        (function () {
            var el = document.querySelector('.home-countdown[data-tip]');
            if (!el) return;
            var target = parseInt(el.getAttribute('data-tip'), 10);
            var nums = el.querySelectorAll('.home-countdown__num');
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            function tick() {
                var s = Math.max(0, Math.floor((target - Date.now()) / 1000));
                nums[0].textContent = Math.floor(s / 86400);
                nums[1].textContent = pad(Math.floor(s % 86400 / 3600));
                nums[2].textContent = pad(Math.floor(s % 3600 / 60));
                nums[3].textContent = pad(s % 60);
            }
            tick();
            setInterval(tick, 1000);
        })();
    </script>
</section>

</body>
</html>
