<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Reusable news list: expects `newsCards` (List<NewsQueryService.NewsCard>).
     Renders nothing when the list is empty. -->
<section th:fragment="news-section" th:unless="${newsCards == null or #lists.isEmpty(newsCards)}"
         style="margin-top: 2rem;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.75rem;">
        <h2 style="margin: 0;">News</h2>
        <a th:href="${newsMoreLink != null ? newsMoreLink : '/news'}" style="font-size: 0.85rem;">More &#8594;</a>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem;">
        <li th:each="card : ${newsCards}" class="card"
            style="display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.6rem 0.8rem;">
            <img th:if="${card.hasThumbnail}" th:src="@{/news/img/{id}(id=${card.id})}" alt=""
                 loading="lazy" style="width: 90px; border-radius: 4px; flex-shrink: 0;"
                 onerror="this.style.display='none'"/>
            <div>
                <a th:href="${card.url}" th:text="${card.title}" target="_blank" rel="noopener"
                   style="font-weight: 600;"></a>
                <p th:if="${card.subtitle}" th:text="${card.subtitle}"
                   style="margin: 0.2rem 0 0; font-size: 0.82rem; color: var(--color-text-muted);"></p>
                <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-top: 0.2rem;">
                    <span th:if="${card.sourceName}" th:text="${card.sourceName}">ESPN</span>
                    <span th:if="${card.sourceName}"> · </span>
                    <span th:text="${#temporals.format(card.publishedAt, 'MMM d, HH:mm')}">—</span>
                    <span> ↗</span>
                </div>
            </div>
        </li>
    </ul>
</section>
</body>
</html>
