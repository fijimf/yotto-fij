<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="tuning-runs" id="tuning-runs-table">
    <p th:if="${#lists.isEmpty(tuningRuns)}"
       style="font-size: 0.85rem; color: var(--color-text-muted); margin: 0;">
        No λ sweeps yet — click Tune λ to run a walk-forward sweep of the
        adjusted-efficiency ridge penalty.
    </p>

    <table th:if="${!#lists.isEmpty(tuningRuns)}">
        <thead>
        <tr>
            <th style="text-align: left;">Started</th>
            <th style="text-align: left;">Status</th>
            <th style="text-align: right;">Duration</th>
            <th style="text-align: right;" title="Grid value with the lowest pooled walk-forward log loss">Best λ</th>
            <th style="text-align: left;">Result</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${tuningRuns}" th:with="r=${v.run}">
            <td th:text="${#temporals.format(r.startedAt, 'MMM d HH:mm')}">Aug 18 14:02</td>
            <td>
                <span th:if="${r.status.name() == 'RUNNING'}"
                      style="display: inline-block; padding: 2px 10px; border-radius: 12px;
                             background: #fef3c7; color: #92400e; font-size: 0.75rem; font-weight: 600;">
                    Running
                </span>
                <span th:if="${r.status.name() == 'COMPLETED'}"
                      style="display: inline-block; padding: 2px 10px; border-radius: 12px;
                             background: #d1fae5; color: #065f46; font-size: 0.75rem; font-weight: 600;">
                    Completed
                </span>
                <span th:if="${r.status.name() == 'FAILED'}"
                      style="display: inline-block; padding: 2px 10px; border-radius: 12px;
                             background: #fee2e2; color: #991b1b; font-size: 0.75rem; font-weight: 600;">
                    Failed
                </span>
            </td>
            <td style="text-align: right;" th:text="${v.duration ?: '—'}">4m 12s</td>
            <td style="text-align: right;">
                <strong th:if="${v.report != null and v.report.bestLambda != null}"
                        th:text="${v.report.bestLambda}">2.0</strong>
                <span th:if="${v.report == null or v.report.bestLambda == null}">—</span>
            </td>
            <td>
                <span th:if="${r.status.name() == 'FAILED'}"
                      style="color: #991b1b;" th:text="${r.error ?: 'failed'}">failed</span>
                <details th:if="${v.report != null}" style="margin: 0;">
                    <summary style="font-size: 0.75rem; color: var(--color-text-muted); cursor: pointer;"
                             th:text="'per-λ metrics (' + ${#lists.size(v.report.seasons)} + ' seasons, σ=' + ${v.report.sigma} + ')'">per-λ metrics</summary>
                    <table style="margin-top: 0.35rem; font-size: 0.8rem;">
                        <thead>
                        <tr>
                            <th style="text-align: right;">λ</th>
                            <th style="text-align: right;">n</th>
                            <th style="text-align: right;">Log loss</th>
                            <th style="text-align: right;">MAE</th>
                            <th style="text-align: right;" title="Population stddev of actual − predicted margin">resid σ</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="lr : ${v.report.perLambda}"
                            th:style="${lr.lambda == v.report.bestLambda} ? 'font-weight: 700;'">
                            <td style="text-align: right;" th:text="${lr.lambda}">1.0</td>
                            <td style="text-align: right;" th:text="${#numbers.formatInteger(lr.overall.n, 0, 'COMMA')}">28,000</td>
                            <td style="text-align: right;" th:text="${lr.overall.logLoss != null} ? ${#numbers.formatDecimal(lr.overall.logLoss, 1, 4)} : '—'">0.6100</td>
                            <td style="text-align: right;" th:text="${lr.overall.mae != null} ? ${#numbers.formatDecimal(lr.overall.mae, 1, 3)} : '—'">8.700</td>
                            <td style="text-align: right;" th:text="${lr.overall.residSigma != null} ? ${#numbers.formatDecimal(lr.overall.residSigma, 1, 2)} : '—'">11.10</td>
                        </tr>
                        </tbody>
                    </table>
                </details>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
