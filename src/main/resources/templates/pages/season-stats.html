<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${season.year} + ' League Overview'">League Overview</title>
</head>
<body>
<main layout:fragment="content">

    <div class="page-header">
        <h1 class="page-title" th:text="${season.year} + ' Season — League Overview'">2026 Season — League Overview</h1>
        <div class="page-header__actions">
            <a class="btn btn--outline btn--sm" th:href="@{/stats}">Stats glossary</a>
            <a class="btn btn--outline btn--sm" th:href="@{'/seasons/' + ${season.year} + '/stats/predictor'}">Predictor</a>
            <a class="btn btn--outline btn--sm" th:href="@{'/seasons/' + ${season.year} + '/stats/correlation'}">Correlation</a>
            <select th:replace="~{fragments/controls :: seasonSelect(${seasonYears}, ${season.year}, '/seasons/{year}/stats')}"></select>
        </div>
    </div>

    <!-- Date picker -->
    <div class="analytics-date-row" th:if="${latestDate != null}">
        <th:block th:replace="~{fragments/controls :: asOfDate(${selectedDate}, ${season.startDate}, ${latestDate},
                              '/seasons/' + ${season.year} + '/stats/table', '#stats-table-container')}"/>
        <span class="text-muted" th:text="'Latest data: ' + ${latestDate}">Latest data: 2026-02-26</span>
    </div>

    <!-- Stats table (HTMX-swappable) -->
    <div id="stats-table-container">
        <div th:replace="~{fragments/season-stats-table :: stats-table}"></div>
    </div>

    <div th:if="${latestDate == null}" class="teams-empty">
        No time-series data found for this season. Use the admin panel to run a <strong>Time Series</strong> calculation.
    </div>

</main>

</body>
</html>
