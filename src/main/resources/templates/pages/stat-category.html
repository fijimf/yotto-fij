<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${categoryPage.category().catalogCategory} + ' — ' + ${categoryPage.year()}">Stat Category</title>
</head>
<body>
<main layout:fragment="content">

    <div class="page-header">
        <div>
            <a class="stat-detail__crumb" th:href="@{/stats}">&larr; All stats</a>
            <h1 class="page-title" th:text="${categoryPage.category().catalogCategory}">Results</h1>
            <p class="page-header__subtitle" th:text="${categoryPage.category().description}">Category description.</p>
        </div>
        <div class="page-header__actions">
            <select th:replace="~{fragments/controls :: seasonSelect(${categoryPage.availableSeasons()},
                    ${categoryPage.year()}, '/seasons/{year}/stats/' + ${categoryPage.category().slug})}"></select>
        </div>
    </div>

    <div class="analytics-date-row" th:if="${categoryPage.latestDate() != null}">
        <th:block th:replace="~{fragments/controls :: asOfDate(${categoryPage.date()}, ${categoryPage.seasonStart()},
                              ${categoryPage.latestDate()},
                              '/seasons/' + ${categoryPage.year()} + '/stats/' + ${categoryPage.category().slug} + '/cards',
                              '#category-cards')}"/>
    </div>

    <div id="category-cards">
        <div th:replace="~{fragments/stat-category-cards :: cards}"></div>
    </div>

</main>
</body>
</html>
