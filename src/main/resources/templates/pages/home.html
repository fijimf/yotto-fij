<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Home</title>
</head>
<body>

<main layout:fragment="content">

    <section class="home-hero">
        <div class="home-hero__inner">
            <p class="home-hero__eyebrow">Yotto FIJ</p>
            <h1 class="home-hero__title">DeepFij</h1>
            <p class="home-hero__tagline" th:text="${homePage.heroTagline}">College Basketball &middot; Quantified</p>
        </div>
    </section>

    <!-- Phase-aware panel composition — order and content decided by HomePageService.
         th:insert must sit on a NESTED block: it outranks th:each on the same element,
         so the iteration variable wouldn't exist yet. -->
    <div class="home-panels">
        <th:block th:each="p : ${homePage.panels}">
            <th:block th:insert="~{fragments/home/__${p.fragment}__ :: panel(${p.model})}"/>
        </th:block>
    </div>

</main>

</body>
</html>
